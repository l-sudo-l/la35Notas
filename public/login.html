<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar – la35Notas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="pantalla-login">
  <form class="tarjeta-login" id="formulario-login">
    <div class="logo-login">la35<span>Notas</span></div>
    <div class="subtitulo-login">Sistema de Gestión de Calificaciones</div>
    <div class="campo"><label>Usuario / DNI</label><input type="text" id="dni" autocomplete="username" inputmode="numeric" required autofocus></div>
    <div class="campo"><label>Contraseña</label><input type="password" id="clave" autocomplete="current-password" required></div>
    <div class="error-login" id="error"></div>
    <button class="boton-primario" type="submit">Ingresar al sistema</button>
    <div class="ayuda-login">Si sos madre, padre o tutor no necesitás usuario: recibís los boletines y comunicados por email.</div>
  </form>
</div>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
